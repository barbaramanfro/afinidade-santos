<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qual minha afinidade com os Santos do encontro de hoje?</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ouro:#c19a45;--ouro-claro:#f7f0e1;--texto:#2d2a26;--suave:#7a7368;--borda:#ece6da;--fundo:#fdfcfa}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:var(--fundo);color:var(--texto)}
.wrap{max-width:740px;margin:0 auto;padding:26px 18px 60px}
header{text-align:center;margin-bottom:22px}
.cruz{font-size:28px;color:var(--ouro)}
h1{font-size:clamp(22px,5vw,31px);font-weight:800;margin:8px 0 6px;letter-spacing:-.3px}
.sub{color:var(--suave);font-size:15px;margin:0;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;color:#fff;white-space:nowrap}
.card{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(80,60,20,.06);margin-bottom:16px}
.tela{display:none}.tela.ativa{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}
input{width:100%;padding:14px 16px;font:inherit;font-size:16px;border:1.5px solid var(--borda);border-radius:12px;outline:none}
input:focus{border-color:var(--ouro)}
.btn{border:none;font:inherit;font-weight:700;font-size:16px;padding:14px 22px;border-radius:12px;cursor:pointer;background:var(--ouro);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--texto);border:1.5px solid var(--borda)}
.full{width:100%;margin-top:14px}
.progresso{height:8px;background:var(--ouro-claro);border-radius:99px;overflow:hidden;margin-bottom:10px}
.progresso div{height:100%;background:var(--ouro);transition:width .3s}
.meta{font-size:13px;color:var(--suave);margin-bottom:14px}
.dica{font-size:13.5px;color:#5a544a;background:var(--ouro-claro);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.pergunta{font-size:20px;font-weight:700;line-height:1.35;margin:0 0 16px}
.opcao{display:block;width:100%;text-align:left;font:inherit;font-size:16px;line-height:1.4;padding:15px 16px;margin-bottom:10px;border:1.5px solid var(--borda);border-radius:12px;background:#fff;cursor:pointer;color:var(--texto)}
.opcao:hover{border-color:var(--ouro)}
.opcao.sel{border-color:var(--ouro);background:var(--ouro-claro);font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.revela{text-align:center;border:2px solid var(--ouro);background:linear-gradient(180deg,#fff,var(--ouro-claro));padding:30px 24px}
.revela .pct{font-size:clamp(54px,14vw,78px);font-weight:800;line-height:1;margin:10px 0 4px}
.revela .nomeSanto{font-size:clamp(26px,6.5vw,34px);font-weight:800;margin:4px 0 12px}
.revela .frase{font-size:16px;line-height:1.55;margin:0 0 12px}
.revela .contagem{display:inline-block;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;color:#fff;margin-bottom:14px}
.revela ul{text-align:left;font-size:14.5px;line-height:1.6;color:#4a453d;padding-left:18px;margin:8px 0 14px}
.revela li{margin-bottom:6px}
.convite{background:var(--ouro-claro);border-radius:10px;padding:10px 12px;font-size:14px;text-align:left}
.revela .convite{background:#fff}
.tit-outros{font-weight:800;font-size:16px;margin:0 0 16px}
.santo-res{margin-bottom:22px}
.topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.topo b{font-size:16px}.topo span{font-weight:800;font-size:18px}
.barra{height:14px;background:#f2eee6;border-radius:99px;overflow:hidden}
.barra div{height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.porque{font-size:14.5px;line-height:1.6;color:#4a453d;margin-top:10px}
.porque p{margin:0 0 8px}
.porque ul{margin:6px 0 10px;padding-left:18px}
.porque li{margin-bottom:6px}
.centro{text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="cruz">✝</div>
  <h1>Qual minha afinidade com os Santos do encontro de hoje?</h1>
  <p class="sub">Não existe resposta certa ou errada. Responda com o coração, pensando em como você realmente age.</p>
  <div class="chips" id="chips"></div>
</header>

<section id="t-inicio" class="tela ativa">
  <div class="card">
    <label for="nome">Qual é o seu nome?</label>
    <input id="nome" maxlength="50" placeholder="Digite seu nome" autocomplete="off">
    <button class="btn full" onclick="iniciar()">Começar</button>
  </div>
</section>

<section id="t-quiz" class="tela">
  <div class="card">
    <div class="progresso"><div id="prog"></div></div>
    <div class="meta" id="cont"></div>
    <div class="dica">Todas as opções são bonitas. Escolha a que <b>mais tem o seu jeito</b>.</div>
    <div class="pergunta" id="pergunta"></div>
    <div id="opcoes"></div>
    <div class="nav">
      <button class="btn sec" id="bVoltar" onclick="voltar()">Voltar</button>
      <button class="btn" id="bAvancar" onclick="avancar()" disabled>Próxima</button>
    </div>
  </div>
</section>

<section id="t-res" class="tela">
  <div class="card revela" id="destaque"></div>
  <div class="card"><div class="tit-outros">Seu coração também tem afinidade com…</div><div id="lista"></div></div>
  <div class="centro"><button class="btn sec" onclick="reiniciar()">Responder novamente</button></div>
</section>
</div>

<script>
const SANTOS=[
 {id:'bento',nome:'São Bento',cor:'#6b4f3a',
  recado:'Há em você uma paz que vem de Deus e que acalma quem se aproxima. Você sabe colocar o Senhor em primeiro lugar e fazer do trabalho de cada dia uma oferta de amor. Sua fidelidade silenciosa é como um alicerce firme: sustenta a família, a comunidade e todos que caminham ao seu lado. Que o Senhor continue fazendo de você um instrumento da Sua paz.',
  toque:'A paz que você carrega é um abrigo para quem caminha ao seu lado.',
  convite:'Ao começar cada dia desta semana, ofereça ao Senhor o seu trabalho com uma breve oração.'},
 {id:'rita',nome:'Santa Rita de Cássia',cor:'#8a5aa8',
  recado:'Você tem uma fé perseverante, daquelas que não se cansam de confiar. Quando muitos dizem que não há solução, você entrega tudo nas mãos de Deus e continua rezando com esperança. Essa confiança é um testemunho bonito para todos ao seu redor. O Senhor, que fez florescer rosas no inverno, acolhe cada uma das suas orações com amor de Pai.',
  toque:'Sua fé perseverante é sinal de esperança para muitos.',
  convite:'Confie ao Senhor uma intenção que parece difícil e reze por ela com fé ao longo da semana.'},
 {id:'teresinha',nome:'Santa Teresinha',cor:'#d0708c',
  recado:'Você tem um coração simples e atento, que sabe amar nos pequenos gestos: uma palavra gentil, um cuidado, uma oração por alguém. É justamente nessa simplicidade que Deus mais se revela. Você nos lembra que a santidade não está em grandes feitos, mas em fazer as pequenas coisas com grande amor. Seu jeito de amar é precioso aos olhos do Pai.',
  toque:'Seus pequenos gestos de amor são grandes aos olhos de Deus.',
  convite:'Faça hoje um gesto de bondade por alguém e ofereça-o ao Senhor como uma flor.'},
 {id:'joao',nome:'São João Batista',cor:'#3b82a8',
  recado:'Você traz no coração o ardor de quem deseja que todos conheçam a Deus. Sua fé é verdadeira e sua alegria aponta para Jesus, mesmo sem muitas palavras. Você tem a graça de preparar caminhos: muitas pessoas se aproximam do Senhor pelo seu testemunho. Que o Espírito Santo continue renovando em você essa chama de fé.',
  toque:'Seu testemunho de fé prepara caminhos para outros encontrarem Jesus.',
  convite:'Leve uma palavra de fé e esperança a alguém que precisa ouvi-la nesta semana.'},
 {id:'teresa',nome:"Santa Teresa d'Ávila",cor:'#b0873a',
  recado:'Para você, Deus é o Amigo fiel com quem se conversa todos os dias. Sua oração é sincera, e dela nasce uma alegria serena e uma determinação firme para fazer o bem. Quem convive com você percebe que a fé torna a vida mais leve e mais bonita. Como ensinou a santa: só Deus basta, e você já sabe disso no coração.',
  toque:'Sua amizade com Deus torna a vida de quem está perto mais leve e alegre.',
  convite:'Reserve alguns minutos de silêncio hoje para conversar com o Senhor como quem fala com um amigo.'}
];
const P=(texto,b,r,tz,j,ta)=>({texto,op:[{s:'bento',t:b},{s:'rita',t:r},{s:'teresinha',t:tz},{s:'joao',t:j},{s:'teresa',t:ta}]});
const PERGUNTAS=[
P("Ao acordar pela manhã, qual oração brota primeiro do seu coração?",
 "“Senhor, abençoa o trabalho deste dia.”","“Senhor, confio em Ti para tudo o que vier.”","“Obrigado(a), meu Deus, por mais este dia.”","“Senhor, que hoje eu leve o Teu amor a alguém.”","“Bom dia, Senhor! Caminha comigo hoje.”"),
P("Complete a frase: “Sinto Deus mais perto de mim quando…”",
 "…faço minhas tarefas com calma e oferecidas a Ele.","…vejo uma oração ser atendida.","…percebo o Seu cuidado nos pequenos detalhes.","…vejo alguém se aproximar da fé.","…fico um tempo em silêncio conversando com Ele."),
P("Qual destas imagens melhor representa a sua fé?",
 "Uma lamparina acesa, constante e serena","Uma rosa que floresce mesmo no inverno","Uma pequena flor oferecida com carinho","A água viva de um rio que renova","Um castelo iluminado por dentro"),
P("Qual fruto do Espírito Santo você mais deseja ver florescer em sua vida?",
 "Paz","Mansidão","Amor","Fidelidade","Alegria"),
P("Qual destas cenas do Evangelho mais toca o seu coração?",
 "Jesus se retirando para rezar e depois voltando à missão","Jesus transformando a água em vinho nas bodas de Caná","Jesus acolhendo as crianças: “deixai vir a mim os pequeninos”","O Espírito Santo descendo como pomba sobre Jesus no Jordão","Jesus em Betânia, na casa dos amigos Marta e Lázaro"),
P("Na vida da comunidade, onde você se sente mais à vontade servindo?",
 "Na organização, cuidando para que tudo esteja em ordem","Na oração e na intercessão pelas intenções de todos","Nos pequenos cuidados que ninguém vê, mas fazem diferença","No acolhimento e no convite a quem está afastado","Na animação, trazendo alegria aos encontros"),
P("Qual destas frases você gostaria de guardar no coração?",
 "“Nada antepor ao amor de Cristo.”","“Para Deus nada é impossível.”","“Quero passar o meu céu fazendo o bem na terra.”","“É preciso que Ele cresça e eu diminua.”","“Nada te perturbe, nada te espante, só Deus basta.”"),
P("Quando um irmão ou irmã pede uma palavra de conforto, você costuma dizer…",
 "“Tenha calma, vamos entregar isso a Deus passo a passo.”","“Vou rezar por você. Deus abrirá um caminho.”","“Estou aqui com você”, e ofereço um abraço.","“Jesus está contigo. Vamos juntos à Missa?”","“Vamos conversar com Deus juntos agora mesmo.”"),
P("Qual momento da Santa Missa mais enche o seu coração?",
 "O silêncio respeitoso diante do altar","As preces, quando apresentamos nossas intenções","O ofertório, quando oferecemos a nossa vida","O “Eis o Cordeiro de Deus”","A comunhão, o encontro íntimo com Jesus"),
P("Qual destas palavras você levaria como propósito para esta semana?",
 "Serenidade","Confiança","Ternura","Testemunho","Alegria"),
P("Se tivesse um dia inteiro dedicado a Deus, como o viveria?",
 "Com momentos de oração, leitura da Bíblia e trabalho","Visitando alguém que precisa de esperança","Contemplando a beleza da criação","Partilhando a Palavra com outras pessoas","Em longa conversa com Deus, no silêncio"),
P("Quando sente o Espírito Santo inspirando algo em seu coração, você…",
 "rezo, discirno com calma e começo passo a passo","confio e sigo, certo(a) de que Deus abrirá as portas","digo “sim” com simplicidade, como uma criança","anuncio com alegria o que Deus está fazendo","me entrego com coragem e determinação"),
P("Qual oferta você gostaria de apresentar a Jesus hoje?",
 "O meu trabalho feito com dedicação","A minha confiança total","Cada pequeno gesto de amor do meu dia","Um coração humilde, que deixa Ele crescer","O meu coração inteiro, com alegria"),
P("Qual é o seu jeito preferido de rezar?",
 "Com as orações da Igreja, em horários fiéis","Com súplicas cheias de confiança","Com um simples olhar de amor para o céu","Com louvor e cânticos","Numa conversa sincera de amigo para amigo"),
P("Que dom você gostaria de pedir a Deus para servir melhor aos outros?",
 "O dom de levar paz aos ambientes","O dom de despertar esperança","O dom de fazer cada pessoa se sentir amada","O dom de aproximar as pessoas de Jesus","O dom de espalhar alegria verdadeira"),
P("Como você percebe o amor de Deus no seu dia a dia?",
 "Na tranquilidade de uma vida ordenada com Ele","Nas orações atendidas no tempo certo","No carinho de um abraço ou de um sorriso","Na conversão e na fé das pessoas ao redor","Nos momentos a sós de oração"),
P("Que graça você mais pede a Deus para as pessoas que ama?",
 "Que vivam em paz e união","Que nunca percam a esperança","Que se sintam amadas por Deus","Que encontrem Jesus de verdade","Que sejam amigas de Deus e vivam com alegria"),
P("Como você gostaria que as pessoas se sentissem após estarem com você?",
 "Em paz","Cheias de esperança","Amadas","Mais próximas de Jesus","Alegres no Senhor"),
P("Se escrevesse hoje uma pequena carta a Jesus, ela começaria assim…",
 "“Senhor, obrigado(a) por estar comigo em cada momento.”","“Senhor, eu confio em Ti e espero as Tuas maravilhas.”","“Jesus, eu Te amo com todo o meu coração.”","“Senhor, conta comigo para levar o Teu amor adiante.”","“Meu Senhor e Amigo, que alegria estar contigo.”"),
P("O que mais enche o seu coração de alegria em Deus?",
 "A paz de um dia simples vivido em Sua presença","Ver florescer algo que parecia impossível","Perceber os pequenos presentes de Deus no meu dia","Ver alguém que amo se aproximar de Jesus","Partilhar a vida e a fé com quem eu amo")
];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const embaralhar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S=id=>SANTOS.find(s=>s.id===id);
function mostrar(id){document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));$(id).classList.add('ativa');scrollTo(0,0)}
$('chips').innerHTML=SANTOS.map(s=>`<span class="chip" style="background:${s.cor}">${s.nome}</span>`).join('');
let nome='',atual=0,resp=[],ordemOp=[];
function iniciar(){
  nome=$('nome').value.trim();
  if(!nome){$('nome').focus();$('nome').style.borderColor='#b4534b';return}
  atual=0;resp=new Array(PERGUNTAS.length).fill(null);
  ordemOp=PERGUNTAS.map(p=>embaralhar(p.op.map((_,i)=>i)));
  mostrar('t-quiz');render();
}
$('nome').addEventListener('keydown',e=>{if(e.key==='Enter')iniciar()});
function render(){
  const p=PERGUNTAS[atual];
  $('prog').style.width=(atual/PERGUNTAS.length*100)+'%';
  $('cont').textContent=`Pergunta ${atual+1} de ${PERGUNTAS.length}`;
  $('pergunta').textContent=p.texto;
  $('opcoes').innerHTML=ordemOp[atual].map((oi,k)=>`<button class="opcao ${resp[atual]===oi?'sel':''}" data-oi="${oi}">${String.fromCharCode(65+k)}) ${esc(p.op[oi].t)}</button>`).join('');
  $('opcoes').querySelectorAll('.opcao').forEach(b=>b.onclick=()=>{resp[atual]=+b.dataset.oi;render()});
  $('bVoltar').style.visibility=atual?'visible':'hidden';
  $('bAvancar').textContent=atual===PERGUNTAS.length-1?'Revelar meu santo':'Próxima';
  $('bAvancar').disabled=resp[atual]===null;
}
function voltar(){if(atual>0){atual--;render()}}
function avancar(){if(resp[atual]===null)return;if(atual<PERGUNTAS.length-1){atual++;render()}else resultado()}
function resultado(){
  const r={};SANTOS.forEach(s=>r[s.id]={n:0});
  resp.forEach((oi,i)=>{r[PERGUNTAS[i].op[oi].s].n++});
  const peso=s=>Math.pow(r[s.id].n,1.6);
  const tot=SANTOS.reduce((a,s)=>a+peso(s),0);
  SANTOS.forEach(s=>{const v=peso(s)/tot*100;r[s.id].pct=Math.floor(v);r[s.id].resto=v-Math.floor(v)});
  let falta=100-SANTOS.reduce((a,s)=>a+r[s.id].pct,0);
  SANTOS.slice().sort((a,b)=>r[b.id].resto-r[a.id].resto).forEach(s=>{if(falta>0){r[s.id].pct++;falta--}});
  const ord=SANTOS.slice().sort((a,b)=>r[b.id].n-r[a.id].n);
  const max=r[ord[0].id].n;const top=ord.filter(s=>r[s.id].n===max);
  const NP=PERGUNTAS.length;
  const bloco=s=>`<div class="pct" style="color:${s.cor}">${r[s.id].pct}%</div>
      <div class="nomeSanto" style="color:${s.cor}">${s.nome}</div>
      <span class="contagem" style="background:${s.cor}">${r[s.id].n} das ${NP} respostas tiveram essa afinidade</span>
      <p class="frase">${s.recado}</p>`;
  if(top.length===1){
    $('destaque').innerHTML=`<div class="sub">${esc(nome)}, o seu coração tem grande afinidade com…</div>${bloco(top[0])}
      <div class="convite">💛 ${top[0].convite}</div>`;
  }else{
    $('destaque').innerHTML=`<div class="sub">${esc(nome)}, o seu coração se aproxima de dois santos…</div>
      ${top.map(bloco).join('<hr style="border:none;border-top:1px solid #ece6da;margin:18px 0">')}
      <div class="convite">💛 ${top[0].convite}</div>`;
  }
  $('lista').innerHTML=ord.filter(s=>!top.includes(s)).map(s=>`<div class="santo-res">
      <div class="topo"><b style="color:${s.cor}">${s.nome}</b><span>${r[s.id].pct}%</span></div>
      <div class="barra"><div data-w="${r[s.id].pct}" style="background:${s.cor}"></div></div>
      <div class="porque"><p>${s.toque}</p></div></div>`).join('');
  mostrar('t-res');
  setTimeout(()=>document.querySelectorAll('#lista .barra div').forEach(b=>b.style.width=b.dataset.w+'%'),120);
}
function reiniciar(){$('nome').value='';mostrar('t-inicio')}
</script>
</body>
</html>
